<style>
.ufp { font-family: inherit; color: inherit; font-size: 14px; line-height: 1.35; }
.ufp * { box-sizing: border-box; }

.ufp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ufp-title { font-weight: 600; }
.ufp-meta { opacity: .65; font-size: 12px; }
.ufp-spacer { flex: 1 1 auto; }
.ufp-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: #9e9e9e; }
.ufp-dot.ok { background: #2e9e4f; }
.ufp-dot.err { background: #d64545; }

.ufp-btn {
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    background: rgba(127,127,127,.14); border: none; color: inherit; font-family: inherit;
}
.ufp-btn:hover { background: rgba(127,127,127,.26); }

.ufp-plan { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
.ufp-plan img { max-width: 100%; height: auto; display: block; border-radius: 8px; }
.ufp-plan.placing { cursor: crosshair; }

.ufp-pin {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    line-height: 1.2; user-select: none; touch-action: none;
}
.ufp-pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.9); box-shadow: 0 0 3px rgba(0,0,0,.5);
    background: #9e9e9e;
}
.ufp-pin.closed .ufp-pin-dot { background: #2e9e4f; }
.ufp-pin.open   .ufp-pin-dot { background: #e6911e; }
.ufp-pin.alarm  .ufp-pin-dot { background: #d64545; animation: ufp-pulse 1s infinite; }
.ufp-pin.muted  .ufp-pin-dot { opacity: .45; }
.ufp-pin.muted  .ufp-pin-label { opacity: .75; }
@keyframes ufp-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(214,69,69,.75); }
    100% { box-shadow: 0 0 0 12px rgba(214,69,69,0); }
}
.ufp-pin-label {
    font-size: 11px; white-space: nowrap; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.62); color: #fff;
}
.ufp-plan.placing .ufp-pin { cursor: grab; }
.ufp-pin.dragging { cursor: grabbing; opacity: .75; }

.ufp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ufp-chip {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
    background: rgba(127,127,127,.16); border: 1px dashed rgba(127,127,127,.5);
    color: inherit; font-family: inherit;
}
.ufp-chip.selected { background: rgba(46,158,79,.30); border-style: solid; font-weight: 600; }
.ufp-hint { font-size: 12px; opacity: .6; margin-top: 8px; }
.ufp-empty { padding: 16px; text-align: center; opacity: .55; font-size: 13px; }
.ufp-error {
    padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px;
    background: rgba(214,69,69,.20);
}
</style>

<div class="ufp" id="ufp-root"></div>

<script>
var UFP_DATA = /*%%PAYLOAD%%*/null;
var UFP_PLAN = '%%FLOORPLAN%%';
var UFP_OFFSET = 0;
var UFP_SIGNATURE = null;
var UFP_PLACING = false;
var UFP_SELECTED = '';
var UFP_DRAGGING = null;

/* ---------- Kommunikation mit dem Modul ---------- */

function handleMessage(data) {
    try {
        UFP_DATA = (typeof data === 'string') ? JSON.parse(data) : data;
    } catch (e) {
        return;
    }
    ufpSyncClock();
    ufpRefreshView();
}

function ufpRefresh() {
    requestAction('Refresh', true);
}

function ufpClearPositions() {
    requestAction('ClearDoorPositions', true);
}

function ufpSendPosition(id, x, y) {
    requestAction('SetDoorPosition', JSON.stringify({ door: id, x: x, y: y }));
}

/* ---------- Hilfsfunktionen ---------- */

function ufpSyncClock() {
    if (UFP_DATA && UFP_DATA.now) {
        UFP_OFFSET = UFP_DATA.now * 1000 - Date.now();
    }
}

function ufpNow() {
    return Math.floor((Date.now() + UFP_OFFSET) / 1000);
}

function ufpEsc(text) {
    return String(text === null || text === undefined ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function ufpDuration(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    var pad = function (v) { return v < 10 ? '0' + v : String(v); };
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}

function ufpAgo(ts) {
    if (!ts) { return 'nie'; }
    var diff = Math.max(0, ufpNow() - ts);
    if (diff < 60) { return 'vor ' + diff + ' s'; }
    if (diff < 3600) { return 'vor ' + Math.floor(diff / 60) + ' min'; }
    return new Date(ts * 1000).toLocaleString('de-DE');
}

function ufpHasPlan() {
    return UFP_PLAN.indexOf('data:') === 0;
}

/* ---------- Rendering ---------- */

function ufpSignature(data) {
    var parts = [UFP_PLACING ? 1 : 0, UFP_SELECTED, data.status, data.source,
        data.error || '', data.caption || '', data.labels ? 1 : 0];
    (data.doors || []).forEach(function (door) {
        parts.push([door.id, door.name, door.open, door.alarm, door.siren,
            door.sensor, door.monitored, door.since, door.x, door.y].join(','));
    });
    return parts.join('|');
}

function ufpRefreshView() {
    // Waehrend eines Drags nicht neu aufbauen, sonst reisst es den Pin weg
    if (UFP_DRAGGING) { return; }

    var signature = UFP_DATA ? ufpSignature(UFP_DATA) : '';
    if (signature !== UFP_SIGNATURE) {
        ufpRender();
    } else {
        ufpTick();
    }
}

function ufpTick() {
    var now = ufpNow();
    var root = document.getElementById('ufp-root');
    if (!root) { return; }

    var durations = root.querySelectorAll('.ufp-dur');
    for (var i = 0; i < durations.length; i++) {
        var since = parseInt(durations[i].getAttribute('data-since'), 10);
        durations[i].textContent = ufpDuration(now - (since || now));
    }

    var ago = root.querySelector('.ufp-ago');
    if (ago && UFP_DATA) {
        ago.textContent = ufpAgo(UFP_DATA.lastPoll);
    }
}

function ufpPinClass(door) {
    if (!door.sensor) { return ''; }
    if (door.alarm) { return ' alarm'; }
    if (door.open) { return ' open'; }
    return ' closed';
}

function ufpPinLabel(door, now) {
    var label = ufpEsc(door.name);
    if (door.sensor && door.open) {
        label += ' &middot; <span class="ufp-dur" data-since="' + (door.since || now) + '">' +
            ufpDuration(now - (door.since || now)) + '</span>';
    }
    if (door.monitored && !door.siren) {
        label += ' &middot; Wartung';
    }
    return label;
}

function ufpTogglePlacing() {
    UFP_PLACING = !UFP_PLACING;
    UFP_SELECTED = '';
    ufpRender();
}

function ufpSelectDoor(id) {
    UFP_SELECTED = (UFP_SELECTED === id) ? '' : id;
    ufpRender();
}

function ufpPercent(event, plan) {
    var rect = plan.getBoundingClientRect();
    if (!rect.width || !rect.height) { return null; }
    return {
        x: Math.min(100, Math.max(0, ((event.clientX - rect.left) / rect.width) * 100)),
        y: Math.min(100, Math.max(0, ((event.clientY - rect.top) / rect.height) * 100))
    };
}

function ufpPlanClick(event) {
    if (!UFP_PLACING || UFP_SELECTED === '') { return; }
    // Klicks auf eine bereits gesetzte Tuer behandelt ufpPinDown
    if (event.target.closest && event.target.closest('.ufp-pin')) { return; }

    var position = ufpPercent(event, document.getElementById('ufp-plan'));
    if (!position) { return; }

    ufpSendPosition(UFP_SELECTED, position.x, position.y);
    UFP_SELECTED = '';
    ufpRender();
}

function ufpPinDown(event) {
    if (!UFP_PLACING) { return; }
    event.preventDefault();
    event.stopPropagation();

    var pin = event.currentTarget;
    UFP_DRAGGING = { pin: pin, id: pin.getAttribute('data-door'), moved: false };
    pin.classList.add('dragging');
    pin.setPointerCapture(event.pointerId);
}

function ufpPinMove(event) {
    if (!UFP_DRAGGING) { return; }
    var position = ufpPercent(event, document.getElementById('ufp-plan'));
    if (!position) { return; }

    UFP_DRAGGING.moved = true;
    UFP_DRAGGING.last = position;
    UFP_DRAGGING.pin.style.left = position.x + '%';
    UFP_DRAGGING.pin.style.top = position.y + '%';
}

function ufpPinUp() {
    if (!UFP_DRAGGING) { return; }
    var drag = UFP_DRAGGING;
    UFP_DRAGGING = null;
    drag.pin.classList.remove('dragging');

    if (drag.moved && drag.last) {
        ufpSendPosition(drag.id, drag.last.x, drag.last.y);
    } else {
        // Klick ohne Bewegung nimmt die Tuer wieder vom Grundriss
        ufpSendPosition(drag.id, -1, -1);
    }
}

function ufpRender() {
    var root = document.getElementById('ufp-root');
    if (!root) { return; }

    var data = UFP_DATA;
    if (!data) {
        root.innerHTML = '<div class="ufp-empty">Keine Daten.</div>';
        return;
    }
    if (!ufpHasPlan()) {
        root.innerHTML = '<div class="ufp-empty">Kein Grundriss hinterlegt. ' +
            'In der Instanzkonfiguration ein Medienobjekt ausw&auml;hlen.</div>';
        return;
    }

    var doors = data.doors || [];
    var now = ufpNow();
    var healthy = (data.source === 102);

    var html = '<div class="ufp-head">' +
        '<span class="ufp-dot ' + (healthy ? 'ok' : 'err') + '"></span>';
    if (data.caption) {
        html += '<span class="ufp-title">' + ufpEsc(data.caption) + '</span>';
    }
    html += '<span class="ufp-meta">Abfrage <span class="ufp-ago">' + ufpAgo(data.lastPoll) + '</span></span>' +
        '<div class="ufp-spacer"></div>' +
        '<button class="ufp-btn" onclick="ufpTogglePlacing()">' +
        (UFP_PLACING ? 'Platzieren beenden' : 'T&uuml;ren platzieren') + '</button>';
    if (UFP_PLACING) {
        html += '<button class="ufp-btn" onclick="ufpClearPositions()">Alle entfernen</button>';
    } else {
        html += '<button class="ufp-btn" onclick="ufpRefresh()">Aktualisieren</button>';
    }
    html += '</div>';

    if (!healthy && data.error) {
        html += '<div class="ufp-error">' + ufpEsc(data.error) + '</div>';
    }

    html += '<div class="ufp-plan' + (UFP_PLACING ? ' placing' : '') +
        '" id="ufp-plan" onclick="ufpPlanClick(event)">' +
        '<img src="' + UFP_PLAN + '" alt="Grundriss">';

    doors.forEach(function (door) {
        if (door.x === null || door.y === null) { return; }
        var muted = (door.monitored && !door.siren) ? ' muted' : '';
        html += '<div class="ufp-pin' + ufpPinClass(door) + muted +
            '" style="left:' + door.x + '%;top:' + door.y + '%"' +
            ' data-door="' + ufpEsc(door.id) + '"' +
            ' title="' + ufpEsc(door.name) + '"' +
            ' onpointerdown="ufpPinDown(event)">' +
            '<span class="ufp-pin-dot"></span>';
        if (data.labels) {
            html += '<span class="ufp-pin-label">' + ufpPinLabel(door, now) + '</span>';
        }
        html += '</div>';
    });

    html += '</div>';

    if (UFP_PLACING) {
        var open = doors.filter(function (door) { return door.x === null || door.y === null; });
        if (open.length > 0) {
            html += '<div class="ufp-chips">';
            open.forEach(function (door) {
                html += '<button class="ufp-chip' + (UFP_SELECTED === door.id ? ' selected' : '') +
                    '" onclick="ufpSelectDoor(\'' + ufpEsc(door.id) + '\')">' +
                    ufpEsc(door.name) + '</button>';
            });
            html += '</div>';
            html += '<div class="ufp-hint">T&uuml;r ausw&auml;hlen, dann auf den Grundriss klicken. ' +
                'Gesetzte T&uuml;ren lassen sich verschieben, ein Klick darauf nimmt sie wieder herunter.</div>';
        } else {
            html += '<div class="ufp-hint">Alle T&uuml;ren sind platziert. Verschieben per Ziehen, ' +
                'ein Klick auf eine T&uuml;r nimmt sie wieder herunter.</div>';
        }
    }

    root.innerHTML = html;
    UFP_SIGNATURE = ufpSignature(data);
}

document.addEventListener('pointermove', ufpPinMove);
document.addEventListener('pointerup', ufpPinUp);
document.addEventListener('pointercancel', ufpPinUp);

ufpSyncClock();
ufpRender();
// Laufende Offen-Dauer sekundengenau mitzaehlen, ohne den Server zu fragen
setInterval(ufpTick, 1000);
</script>
